name: Host dispatch semantics
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  semantics:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [local, published]
    steps:
      - uses: actions/checkout@v6
        with:
          path: toolsy
      - uses: actions/setup-go@v6
        with:
          go-version-file: toolsy/go.mod
      - uses: actions/checkout@v6
        if: matrix.mode == 'local'
        with:
          repository: skosovsky/prompty
          path: prompty
      - uses: actions/checkout@v6
        if: matrix.mode == 'local'
        with:
          repository: skosovsky/flowy
          path: flowy
      - uses: actions/checkout@v6
        if: matrix.mode == 'local'
        with:
          repository: skosovsky/guardy
          path: guardy
      - name: Semantic fixtures
        working-directory: toolsy
        env:
          PROMPTY_DIR: ${{ github.workspace }}/prompty
          FLOWY_DIR: ${{ github.workspace }}/flowy
          GUARDY_DIR: ${{ github.workspace }}/guardy
        run: scripts/task36-integration.sh '${{ matrix.mode }}'
  released-consumer:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Published root consumer without workspace or replace
        run: GOPROXY=direct scripts/task36-integration.sh released '${{ github.ref_name }}'
